services:
  postgres-test:
    image: postgres:16-alpine
    container_name: ielts-postgres-test
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: ielts_test
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    container_name: ielts-redis-test
    ports:
      - "6380:6379"